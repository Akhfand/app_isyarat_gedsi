<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Daftar Akun - IsyaratInklusi GEDSI</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-7 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-5">
                        <div class="text-center">
                            <h1 class="h4 text-gray-900 font-weight-bold mb-2">Buat Akun Pembelajar</h1>
                            <p class="small text-muted mb-4">Mulai perjalanan belajar BISINDO, SIBI & Literasi GEDSI.</p>
                        </div>
                        <form id="register-form" class="user">
                            <div class="form-group">
                                <input type="text" id="reg-name" class="form-control form-control-user" placeholder="Nama Lengkap" required>
                            </div>
                            <div class="form-group">
                                <input type="email" id="reg-email" class="form-control form-control-user" placeholder="Alamat Email" required>
                            </div>
                            <div class="form-group">
                                <input type="password" id="reg-password" class="form-control form-control-user" placeholder="Password (minimal 6 karakter)" minlength="6" required>
                            </div>
                            <button type="submit" id="btn-register" class="btn btn-primary btn-user btn-block font-weight-bold">
                                Daftar Akun
                            </button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a class="small font-weight-bold" href="login.html">Sudah punya akun? Masuk di sini!</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-register");
            btn.disabled = true;
            btn.innerText = "Mendaftarkan...";

            const fullName = document.getElementById("reg-name").value;
            const email = document.getElementById("reg-email").value;
            const password = document.getElementById("reg-password").value;

            const { error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { full_name: fullName } }
            });

            if (error) {
                alert("Gagal mendaftar: " + error.message);
                btn.disabled = false;
                btn.innerText = "Daftar Akun";
            } else {
                alert("Pendaftaran berhasil! Kamu langsung masuk ke aplikasi.");
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
