<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Masuk - IsyaratInklusi GEDSI</title>
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-7 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-5">
                        <div class="text-center">
                            <h1 class="h4 text-gray-900 font-weight-bold mb-2">Selamat Datang Kembali!</h1>
                            <p class="small text-muted mb-4">Masuk untuk menyimpan progres XP & Peringkat belajarmu.</p>
                        </div>
                        <form id="login-form" class="user">
                            <div class="form-group">
                                <input type="email" id="login-email" class="form-control form-control-user" placeholder="Masukkan Alamat Email..." required>
                            </div>
                            <div class="form-group">
                                <input type="password" id="login-password" class="form-control form-control-user" placeholder="Password" required>
                            </div>
                            <button type="submit" id="btn-login" class="btn btn-primary btn-user btn-block font-weight-bold">
                                Masuk
                            </button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a class="small font-weight-bold" href="register.html">Belum punya akun? Daftar sekarang!</a>
                        </div>
                        <div class="text-center mt-2">
                            <a class="small text-secondary" href="index.html">Lanjut tanpa login (Mode Tamu) &rarr;</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-login");
            btn.disabled = true;
            btn.innerText = "Memproses...";

            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Gagal masuk: " + error.message);
                btn.disabled = false;
                btn.innerText = "Masuk";
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
